version: '3.7'
services:
  blog:
    build:
      context: https://github.com/josselinbuils/blog.git
      args:
        - HTTP_PREFIX=/blog
    environment:
      - HTTP_PREFIX=/blog
      - NODE_ENV=production
    expose:
      - "3000"
    logging:
      driver: "json-file"
      options:
        max-size: "100k"
    restart: always

  buildmanager:
    build: https://github.com/josselinbuils/build-manager.git
    expose:
      - "9001"
    logging:
      driver: "json-file"
      options:
        max-size: "100k"
    ports:
      - "8090:8090"
    restart: always
    volumes:
      - ./build-manager/config.json:/build-manager/config.json

  portfolio:
    build: https://github.com/josselinbuils/portfolio.git
    environment:
      - HTTP_PREFIX=/
      - NODE_ENV=production
    expose:
      - "3000"
    logging:
      driver: "json-file"
      options:
        max-size: "100k"
    volumes:
      - ./portfolio/assets:/portfolio/public/assets
      - ./portfolio/config.json:/portfolio/config.json
      - ./portfolio/persistentState.json:/portfolio/persistentState.json

  reverseproxy:
    image: caddy:2.10.2-alpine
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      - "80:80"
      - "443:443"
    restart: always
    volumes:
      - ./reverse-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./reverse-proxy/caddy/data:/data
      - ./reverse-proxy/caddy/config:/config

  teravia:
    build: https://github.com/josselinbuils/teravia.git
    environment:
      - HTTP_PREFIX=/teravia
    expose:
      - "9000"
    logging:
      driver: "json-file"
      options:
        max-size: "100k"

  volleyballstats:
    image: nginx:1.27-alpine
    expose:
      - "80"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    restart: always
    volumes:
      - ./volleyball-stats/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./volleyball-stats/site:/usr/share/nginx/html/volleyball:ro
      - ./volleyball-stats/video_key.conf:/etc/nginx/volleyball_video_key.conf:ro
      - ./volleyball-stats/feedback:/var/log/nginx/feedback
