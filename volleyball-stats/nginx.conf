# Viewers' reports of a moment (web.py --feedback): their bodies kept, one JSON object a line, 5 a
# minute per visitor (Cloudflare's address of them), 2 KB each; no address kept.
limit_req_zone $http_cf_connecting_ip zone=feedback:1m rate=5r/m;
log_format feedback escape=json '{"received":"$time_iso8601","report":"$request_body"}';

# A match's video copy opens to the cookie video_key holding the SHA-256 of "volleyball:" and the
# password, kept in video_key.conf as `"<sha256>" 1;`. Wrong keys: 10 a minute per visitor.
map_hash_bucket_size 128;
map $cookie_video_key $video_ok {
  default 0;
  include /etc/nginx/volleyball_video_key.conf;
}
map $video_ok $video_root {
  1 /usr/share/nginx/html;
  default /nonexistent;
}
map $video_ok $video_bad {
  1 "";
  default $http_cf_connecting_ip;
}
limit_req_zone $video_bad zone=video:1m rate=10r/m;

# Each request with its duration, bytes sent, Cloudflare's visitor and ray, and its connection: aborted
# (499) and slow transfers show.
log_format timed '$time_iso8601 $http_cf_connecting_ip $http_cf_ray "$request" $status $body_bytes_sent/$bytes_sent $request_time conn=$connection#$connection_requests "$http_user_agent"';

server {
  listen 80;
  root /usr/share/nginx/html;
  access_log /var/log/nginx/access.log timed;
  error_log /var/log/nginx/error.log info;
  # Behind the reverse proxy: relative redirects, /volleyball -> /volleyball/.
  absolute_redirect off;
  location / {
    try_files $uri $uri/ =404;
  }
  # A match page with its video: without the key, back to the page without it, which asks the
  # password; never kept by a cache on the way.
  location ~ ^/volleyball/[^/]+/video(/|$) {
    limit_req zone=video burst=10 nodelay;
    limit_req_status 429;
    root $video_root;
    add_header Cache-Control "private, no-store" always;
    try_files $uri $uri/ @no_video;
  }
  location @no_video {
    add_header Cache-Control "private, no-store" always;
    rewrite ^/volleyball/([^/]+)/ /volleyball/$1/?video=denied? redirect;
  }
  location = /volleyball/feedback {
    limit_except POST { deny all; }
    limit_req zone=feedback burst=5 nodelay;
    client_max_body_size 2k;
    client_body_buffer_size 2k;
    access_log /var/log/nginx/feedback/feedback.log feedback;
    # Proxied to itself so the body is read, then logged.
    proxy_pass http://127.0.0.1/volleyball/feedback-saved;
  }
  # Connections and requests in progress, for the server's monitor (/usr/local/bin/vbs-monitor.sh) only.
  location = /volleyball/nginx-status {
    stub_status;
    allow 127.0.0.1;
    deny all;
    access_log off;
  }
  # Answers 204 to anyone, doing nothing else.
  location = /volleyball/feedback-saved {
    access_log off;
    return 204;
  }
}
